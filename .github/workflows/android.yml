name: Android

# Debug APK on every push/PR. Release APK + AAB on version tags (v*) or manual dispatch,
# signed ONLY when the repository secrets below exist. No signing key is ever generated
# here; the keystore is created and held by Meridian (docs/RELEASE.md).
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   API_BASE_URL               https://attendance.<domain>  (release builds refuse http:// or localhost)
#   ANDROID_KEYSTORE_BASE64    base64 of the release keystore:  base64 -w0 meridian-release.jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   GOOGLE_SERVICES_JSON       (optional) contents of app/google-services.json for FCM
#   PLAY_SERVICE_ACCOUNT_JSON  (optional) Play Console API service-account JSON for internal-testing upload

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Build release APK + AAB (requires signing secrets)"
        type: boolean
        default: true
      upload_to_play_internal:
        description: "Upload the AAB to Google Play internal testing (requires PLAY_SERVICE_ACCOUNT_JSON)"
        type: boolean
        default: false
      version_code:
        description: "versionCode override (integer, must increase for Play)"
        required: false
      version_name:
        description: "versionName override (e.g. 1.0.0)"
        required: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g

defaults:
  run:
    working-directory: android

jobs:
  debug:
    name: Unit tests, lint, debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Optional repository variable (Settings → Secrets and variables → Actions → Variables):
      # the backend address a test phone can reach, e.g. http://192.168.1.50:8000 or https://…
      # Unset → http://10.0.2.2:8000, which only works in the Android emulator.
      MERIDIAN_DEBUG_API_BASE_URL: ${{ vars.DEBUG_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Android SDK (cmdline-tools, platform 36, build-tools 36)
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          accept-android-sdk-licenses: true

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: google-services.json (optional secret)
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_JSON" ]; then printf '%s' "$GS_JSON" > app/google-services.json; echo "google-services.json written"; else echo "No GOOGLE_SERVICES_JSON secret: building without Firebase push"; fi

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meridian-attendance-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore

  release:
    name: Release APK + AAB (signed when secrets exist)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: debug
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_release)
    env:
      MERIDIAN_API_BASE_URL: ${{ secrets.API_BASE_URL }}
      MERIDIAN_VERSION_CODE: ${{ inputs.version_code || github.run_number }}
      MERIDIAN_VERSION_NAME: ${{ inputs.version_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '0.0.0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        id: secrets
        env:
          HAS_URL: ${{ secrets.API_BASE_URL != '' }}
          HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
          HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          if [ "$HAS_URL" != "true" ]; then
            echo "::error::Secret API_BASE_URL is not set; a release build requires the https URL of the production backend."
            exit 1
          fi
          echo "signing=$HAS_SIGNING" >> "$GITHUB_OUTPUT"
          echo "play=$HAS_PLAY" >> "$GITHUB_OUTPUT"
          if [ "$HAS_SIGNING" != "true" ]; then
            echo "::warning::Signing secrets missing - the release APK/AAB will be UNSIGNED and cannot be installed or uploaded."
          fi

      - name: Normalise version name (strip leading v)
        run: echo "MERIDIAN_VERSION_NAME=${MERIDIAN_VERSION_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          accept-android-sdk-licenses: true

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: google-services.json (optional secret)
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_JSON" ]; then printf '%s' "$GS_JSON" > app/google-services.json; echo "google-services.json written"; else echo "No GOOGLE_SERVICES_JSON secret: building without Firebase push"; fi

      - name: Decode keystore and write signing properties
        if: steps.secrets.outputs.signing == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > keystore.jks
          chmod 600 keystore.jks
          # keystore.properties is kept for reference/tooling; the build itself reads the
          # MERIDIAN_* values from the environment (app/build.gradle.kts configValue()).
          {
            echo "storeFile=$PWD/keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties
          {
            echo "MERIDIAN_KEYSTORE_PATH=$PWD/keystore.jks"
            echo "MERIDIAN_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "MERIDIAN_KEY_ALIAS=$KEY_ALIAS"
            echo "MERIDIAN_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$KEYSTORE_PASSWORD"; echo "::add-mask::$KEY_PASSWORD"

      - name: Assemble release APK and bundle
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Verify signature
        if: steps.secrets.outputs.signing == 'true'
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: meridian-attendance-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: meridian-attendance-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload mapping file (for crash de-obfuscation)
        uses: actions/upload-artifact@v4
        with:
          name: meridian-attendance-release-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      - name: Upload to Google Play internal testing
        if: >-
          steps.secrets.outputs.signing == 'true' && steps.secrets.outputs.play == 'true'
          && github.event_name == 'workflow_dispatch' && inputs.upload_to_play_internal
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: za.co.meridiangroup.attendance
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt

      - name: Remove signing material from the runner
        if: always()
        run: rm -f keystore.jks keystore.properties app/google-services.json
