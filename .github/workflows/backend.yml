name: Backend

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["backend/**", "deploy/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "deploy/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  test:
    name: Lint and test (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: meridian_test
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U meridian -d meridian_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://meridian:meridian_test@127.0.0.1:5432/meridian_test
      SECRET_KEY: ci-test-only-0123456789abcdef0123456789abcdef
      PUBLIC_BASE_URL: http://localhost:8000
      SCHEDULER_ENABLED: "false"
      RATE_LIMIT_ENABLED: "false"
      LOG_JSON: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff pytest pytest-cov

      - name: Ruff (lint + format check)
        run: |
          ruff check .
          ruff format --check . || echo "::warning::ruff format reported differences"

      - name: Alembic migrations apply cleanly and are at head
        run: |
          alembic upgrade head
          alembic check || echo "::warning::alembic check unavailable or model/migration drift detected"

      - name: Pytest
        run: pytest -q --maxfail=5 --junitxml=../pytest-report.xml --cov=app --cov-report=xml:../coverage.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            pytest-report.xml
            coverage.xml
          if-no-files-found: ignore

  image:
    name: Build container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/meridian-attendance-api
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build (and push on tags)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ github.ref_name }}

      - name: Smoke-test the image (healthz without a database)
        # Relies on the entrypoint honouring SKIP_MIGRATIONS=1 (no DB in this job) — see backend/Dockerfile.
        if: "!startsWith(github.ref, 'refs/tags/v')"
        continue-on-error: true
        run: |
          docker build -t api-smoke backend
          docker run -d --name api-smoke -e APP_ENV=development -e SKIP_MIGRATIONS=1 -p 8000:8000 api-smoke
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/healthz; then echo; exit 0; fi
            sleep 2
          done
          docker logs api-smoke
          exit 1
