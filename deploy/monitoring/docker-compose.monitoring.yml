# Optional monitoring stack for a single-host deployment.
# Joins the production compose project's networks so it can scrape api:8000 and db.
#
#   echo "<METRICS_TOKEN from production.env>" > deploy/monitoring/metrics-token && chmod 600 deploy/monitoring/metrics-token
#   docker compose --env-file deploy/env/production.env -f deploy/docker-compose.yml \
#       -f deploy/monitoring/docker-compose.monitoring.yml up -d
#
# Grafana is published on 127.0.0.1:3000 only; reach it over an SSH tunnel
# (ssh -L 3000:127.0.0.1:3000 user@server) or put it behind Caddy with authentication.

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/metrics-token:/etc/prometheus/metrics-token:ro
      - prometheus_data:/prometheus
    networks: [internal, edge]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks: [edge]

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks: [edge]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    networks: [internal]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro,rslave
      - ./backups:/textfile:ro     # backup.sh can drop meridian_backup.prom here (see monitoring/README.md)
    networks: [internal]

volumes:
  prometheus_data:
  grafana_data:
