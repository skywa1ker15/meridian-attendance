# Prometheus alert rules for Meridian Attendance.
#
# NOTE for the integrator: the HTTP metric names exposed by the API come from
# backend/app/core/metrics (prometheus-client). The rules below assume a counter
# `meridian_http_requests_total{method,path,status}` and a histogram
# `meridian_http_request_duration_seconds`. Run
#   curl -H "Authorization: Bearer $METRICS_TOKEN" http://127.0.0.1:8000/metrics
# once and adjust the metric names if they differ. The `up`-based rules and the
# exporter rules work regardless.

groups:
  - name: meridian-availability
    rules:
      - alert: MeridianApiDown
        expr: up{job="meridian-api"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Attendance API is down"
          description: "Prometheus cannot scrape the API ({{ $labels.instance }}) for 2 minutes. Phones cannot submit or confirm attendance (events are queued offline on the devices)."

      - alert: MeridianDatabaseDown
        expr: up{job="postgres"} == 0 or pg_up == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "PostgreSQL is down or unreachable"
          description: "postgres-exporter reports the database as unavailable. /readyz will return 503."

      - alert: MeridianApiNotReady
        # Exposed by the API when the readiness probe fails (DB unreachable or migrations not at head).
        expr: meridian_ready == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "API is up but not ready (database/migrations)"
          description: "Check `docker compose logs api` and `/readyz`."

  - name: meridian-errors
    rules:
      - alert: MeridianHigh5xxRate
        expr: |
          sum(rate(meridian_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(meridian_http_requests_total[5m])), 0.01) > 0.02
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "More than 2% of API responses are 5xx"
          description: "5xx ratio over 5 min is {{ $value | humanizePercentage }}. Inspect logs: deploy/scripts/logs.md."

      - alert: MeridianAny5xxBurst
        expr: sum(increase(meridian_http_requests_total{status=~"5.."}[10m])) > 20
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: "More than 20 server errors in 10 minutes"

      - alert: MeridianSlowRequests
        expr: |
          histogram_quantile(0.95, sum(rate(meridian_http_request_duration_seconds_bucket{path!~"/api/v1/admin/reports.*"}[5m])) by (le)) > 1.5
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "p95 API latency above 1.5 s (excluding report exports)"

      - alert: MeridianLoginBruteForce
        expr: sum(increase(meridian_http_requests_total{path="/api/v1/auth/login",status=~"401|423|429"}[15m])) > 100
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: "Unusual number of failed logins"
          description: "More than 100 failed/limited login attempts in 15 minutes. Review the audit log and client IPs (Caddy access log)."

  - name: meridian-host
    rules:
      - alert: HostDiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) < 0.15
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Less than 15% disk free on {{ $labels.mountpoint }}"
          description: "PostgreSQL and backups share this disk. Prune old backups / Docker images or enlarge the volume."

      - alert: HostDiskSpaceCritical
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) < 0.05
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Less than 5% disk free on {{ $labels.mountpoint }} — database writes will fail soon"

      - alert: HostMemoryPressure
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Host memory usage above 90%"

      - alert: HostHighCpu
        expr: 1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.9
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Host CPU above 90% for 15 minutes"

  - name: meridian-database
    rules:
      - alert: PostgresTooManyConnections
        expr: sum(pg_stat_activity_count) > 85
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "PostgreSQL near max_connections (100)"

      - alert: PostgresReplicationOrBackupStale
        # The backup sidecar writes a file nightly; node-exporter textfile collector can expose
        # its mtime. If you do not set that up, use the host cron check in docs/OPERATIONS.md.
        expr: (time() - meridian_backup_last_success_timestamp_seconds) > 36 * 3600
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: "No successful database backup in 36 hours"

  - name: meridian-tls
    rules:
      - alert: TlsCertificateExpiringSoon
        # Requires blackbox-exporter or Caddy metrics; alternative: deploy/scripts/healthcheck.sh in cron.
        expr: probe_ssl_earliest_cert_expiry - time() < 14 * 86400
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "TLS certificate for {{ $labels.instance }} expires in under 14 days (Caddy should renew automatically — check its logs)"
