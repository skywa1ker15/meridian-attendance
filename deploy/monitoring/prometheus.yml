# Prometheus scrape configuration for Meridian Attendance.
#
# Run with deploy/monitoring/docker-compose.monitoring.yml (Prometheus + Alertmanager +
# Grafana + node/postgres exporters) on the same host, or copy the `meridian-api` job
# into an existing Prometheus.
#
# The API exposes /metrics in Prometheus text format (prometheus-client). When
# METRICS_TOKEN is set in the env file the scrape must send it as a bearer token:
# put the token in deploy/monitoring/metrics-token (git-ignored, chmod 600).

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    system: meridian-attendance
    env: production          # change to staging on the staging host

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: meridian-api
    metrics_path: /metrics
    scheme: http
    # Scrape the container directly on the internal network (no TLS, not via Caddy).
    static_configs:
      - targets: ["api:8000"]
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token

  # Alternative: scrape through Caddy from a separate monitoring host. Caddy only
  # allows METRICS_ALLOW_CIDR, and the token is still required.
  # - job_name: meridian-api-public
  #   scheme: https
  #   static_configs:
  #     - targets: ["attendance.<your-domain>"]
  #   authorization:
  #     type: Bearer
  #     credentials_file: /etc/prometheus/metrics-token

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: caddy
    # Caddy admin endpoint is bound to 127.0.0.1 inside its container; expose it by
    # changing `admin 127.0.0.1:2019` to `admin 0.0.0.0:2019` in the Caddyfile if
    # proxy metrics are wanted (it is on the edge network only, not published).
    static_configs:
      - targets: ["caddy:2019"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
