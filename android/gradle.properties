# Gradle / JVM
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Android
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Kotlin
kotlin.code.style=official

# ---- Application versioning (override with -PMERIDIAN_VERSION_CODE=12 -PMERIDIAN_VERSION_NAME=1.2.0) ----
MERIDIAN_VERSION_CODE=1
MERIDIAN_VERSION_NAME=1.0.0

# ---- API endpoints ----
# Debug builds default to the Android emulator's host alias. Override for a physical phone on the LAN:
#   -PMERIDIAN_DEBUG_API_BASE_URL=http://192.168.1.50:8000
# Release builds REQUIRE an https:// URL (property or environment variable MERIDIAN_API_BASE_URL),
# the build fails otherwise. Never put production URLs with credentials here.
MERIDIAN_DEBUG_API_BASE_URL=http://10.0.2.2:8000
